name: Build

on:
  workflow_call:
    inputs:
      ref:
        default: ${{ github.ref }}
        required: false
        type: string
      upload:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      upload:
        description: Upload artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:

  # Build C library
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Build library
        run: |
          cmake --preset default
          cmake --build build

  # Build Rust crates
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace

  # Build Python wheels
  py:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: ["x86_64", "riscv64", "aarch64"]

        include:
          # Build natively except riscv64, which has no GitHub-hosted runner.
          - arch: x86_64
            runner: ubuntu-latest
          - arch: riscv64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm

          # Set manylinux from arch.
          - arch: x86_64
            manylinux: 2_28
          - arch: riscv64
            manylinux: 2_39
          - arch: aarch64
            manylinux: 2_28

          # maturin-action maps riscv64 2_39 to a native image; use the cross
          # image instead, whose GCC 14 supports C23 (2_31-cross has GCC 7).
          - arch: riscv64
            container: ghcr.io/rust-cross/manylinux_2_39-cross:riscv64

          # Set wheel architecture suffix based on target.
          - arch: riscv64
            wheel-arch-suffix: -riscv64
          - arch: aarch64
            wheel-arch-suffix: -aarch64

          # Use x86-64 build to build source dist once.
          - arch: x86_64
            sdist: --sdist
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: >-
            --release ${{ matrix.sdist }} --out dist
            -m bind/py/Cargo.toml
            --interpreter python3.10
          # manylinux-cross images already ship libclang-dev.
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y clang-devel
            fi
      - name: Store wheel
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: wheels-abi3${{ matrix.wheel-arch-suffix }}
          path: dist
