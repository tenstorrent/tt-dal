name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:

  # Gate job that depends on all required CI jobs passing.
  pass:
    runs-on: ubuntu-latest
    needs:
      - build
      - ctest
      - docs
      - lint
      - test
    steps:
      - run: exit 0

  # Gate job for lint checks.
  lint:
    runs-on: ubuntu-latest
    needs:
      - clippy
      - fmt
      - typos
    steps:
      - run: exit 0

  # Build Rust workspace and Python wheels.
  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      upload: false

  # Check for warnings and lint errors with clippy.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Build rustdoc and verify no warnings are emitted.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --lib --no-deps --all-features --document-private-items

  # Verify code is formatted with rustfmt.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Verify the workspace builds on the minimum supported Rust version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get MSRV from Cargo.toml
        run: |
          msrv=$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="ttdal") | .rust_version'
          )
          echo "msrv=$msrv" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Install Rust ${{ env.msrv }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.msrv }}
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --workspace --all-features

  # Run all Rust tests that do not require hardware.
  test:
    needs: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: |
          set -euxo pipefail
          cargo test --no-fail-fast --workspace
          cargo test --doc --no-fail-fast --workspace --all-features

  # Build and run the C test suite that does not require hardware.
  ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure
        run: cmake --preset default
      - name: Build tests
        run: cmake --build build --target tests
      - name: Run C tests
        run: ctest --test-dir build -LE hardware --output-on-failure

  # Check for typos in source files.
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1
