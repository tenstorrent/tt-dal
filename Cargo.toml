[package]
name = "ttdal-sys"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "FFI bindings to ttdal"
readme = "sys/README.md"
repository = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
links = "ttdal"
build = "sys/build.rs"
include = [
    "/CMakeLists.txt",
    "/LICENSE",
    "/NOTICE",
    "/cmake/**",
    "/include/**",
    "/src/**",
    "/sys/**",
    "/vendor/**",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "sys/src/lib.rs"

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true }
cmake = { workspace = true }
semver = { workspace = true }

[workspace]
resolver = "2"
members = [
    "bind/py",
    "bind/rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Tenstorrent Device Access Library"
repository = "https://github.com/tenstorrent/tt-dal"
license = "Apache-2.0"
keywords = ["tenstorrent", "accelerator", "hardware", "driver", "ffi"]
categories = ["hardware-support", "api-bindings"]

[workspace.dependencies]
bindgen = "0.72.1"
cc = "1.4.0"
cmake = "0.1.58"
libc = "0.2.189"
semver = "1.0.28"
ttdal-sys = { path = ".", version = "0.1.0" }
