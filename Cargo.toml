[workspace]
resolver = "2"
members = [
    "bind/py",
    "bind/rs",
    "bind/rs/sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Tenstorrent Device Access Library"
repository = "https://github.com/tenstorrent/tt-dal"

[workspace.dependencies]
bindgen = "0.72.1"
cc = "1.4.0"
cmake = "0.1.58"
libc = "0.2.189"
ttdal-sys = { path = "bind/rs/sys", version = "0.1.0" }
